# Copy to /etc/nginx/sites-available/shopqr and enable it.
# Certbot can add HTTPS after DNS points to this server.
server {
    listen 80;
    listen [::]:80;
    server_name starsmenu.org www.starsmenu.org;

    root /opt/shopqr/frontend/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name admin.starsmenu.org;

    root /opt/shopqr/admin/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
